name: Crypto MTF analysis

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Pairs, space separated (e.g. BTCUSDT ETHUSDT SOL)"
        default: "BTCUSDT ETHUSDT SOLUSDT"
      timeframes:
        description: "Timeframes, space separated"
        default: "15m 1h 4h 1d 1w"
  schedule:
    - cron: "7 */4 * * *"   # every 4 hours, a few minutes after the 4h candle closes

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SYMBOLS: ${{ inputs.symbols || 'BTCUSDT ETHUSDT SOLUSDT' }}
      TIMEFRAMES: ${{ inputs.timeframes || '15m 1h 4h 1d 1w' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python3 tests/test_cta.py
      - name: Analyse
        # $SYMBOLS / $TIMEFRAMES are intentionally unquoted: word-split into separate args.
        run: |
          python3 -m cta $SYMBOLS --tf $TIMEFRAMES --out report/analysis.md --json-out report/analysis.json
          cat report/analysis.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: crypto-mtf-analysis-${{ github.run_id }}
          path: report/
          retention-days: 14
