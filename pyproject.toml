[project]
name = "quran-karaoke"
version = "0.1.0"
description = "Burn word-synced Quran subtitles (Arabic + Latin + translation) into any video"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
qk = "qk.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["qk"]
